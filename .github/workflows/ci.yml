name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # First against the committed binary: this is what gets deployed, so a
      # Rust change that was not rebuilt and committed fails here.
      - name: Tests against the committed WASM
        run: npm test

      - name: Rust formatting
        run: cargo fmt --check --manifest-path src/wasm/Cargo.toml

      - name: Rust unit tests
        run: npm run test:rust

      # Then against a fresh build, so the Rust source itself is what is tested.
      - name: Rebuild the WASM from source
        run: |
          rustup target add wasm32-unknown-unknown
          node scripts/build-wasm.mjs --require-rust

      - name: Tests against the rebuilt WASM
        run: npm test

      - name: Production build
        run: npx vite build
