[package]
name = "image_suite_wasm"
version = "0.1.0"
edition = "2021"
description = "Image processing core for Image Suite: tonal adjustments, detail filters, dithering, tracing and heightmaps"

[lib]
crate-type = ["cdylib", "rlib"]

# No dependencies: the module exports plain `extern "C"` functions and is
# compiled with rustc directly (see scripts/build-wasm.mjs).
[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
