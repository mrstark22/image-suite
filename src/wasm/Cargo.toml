[package]
name = "image_suite_wasm"
version = "0.1.0"
edition = "2021"
description = "High-performance client-side image processing, CLAHE, and advanced dithering engine for Image Suite"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
web-sys = { version = "0.3.77", features = ["console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
